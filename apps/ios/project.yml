name: SilverCrown
options:
  bundleIdPrefix: com.trucking
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
targets:
  SilverCrown:
    type: application
    platform: iOS
    sources:
      - path: SilverCrown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trucking.silvercrown-
        PRODUCT_NAME: SilverCrown
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "12"
        DEVELOPMENT_TEAM: 6MM44B6ZYT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Silver Crown
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: Silver Crown needs the camera to capture inspection defect photos.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Silver Crown needs photo library access for inspection photos.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: SilverCrown/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - BebasNeue-Regular.ttf
          - Montserrat-Regular.ttf
          - Montserrat-SemiBold.ttf
          - Montserrat-Bold.ttf
        CFBundleDisplayName: Silver Crown
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Silver Crown needs the camera to capture inspection defect photos.
        NSPhotoLibraryUsageDescription: Silver Crown needs photo library access for inspection photos.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseStorage
      - package: firebase-ios-sdk
        product: FirebaseFunctions
schemes:
  SilverCrown:
    build:
      targets:
        SilverCrown: all
    run:
      config: Debug
    archive:
      config: Release
