name: SilverCrown
options:
  bundleIdPrefix: com.trucking
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
targets:
  SilverCrown:
    type: application
    platform: iOS
    sources:
      - path: SilverCrown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trucking.silvercrown-
        PRODUCT_NAME: SilverCrown
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Silver Crown
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Silver Crown needs the camera to capture inspection defect photos.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Silver Crown needs photo library access for inspection photos.
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseStorage
      - package: firebase-ios-sdk
        product: FirebaseFunctions
schemes:
  SilverCrown:
    build:
      targets:
        SilverCrown: all
    run:
      config: Debug
